name: Build

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main]

jobs:
  build:
    name: Validate Docker Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build backend
        run: pnpm --filter devlens-backend build

      - name: Build frontend
        run: pnpm --filter devlens-frontend build

      - name: Build Docker images
        run: |
          docker build -t devlens-backend:test ./src/backend
          docker build -t devlens-frontend:test ./src/frontend
