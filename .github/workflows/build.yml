name: Build

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main]

jobs:
  build:
    name: Validate Docker Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build backend
        run: npm run build -w devlens-backend

      - name: Build frontend
        run: npm run build -w devlens-frontend

      - name: Build Docker images
        run: |
          docker build -t devlens-backend:test ./src/backend
          docker build -t devlens-frontend:test ./src/frontend
